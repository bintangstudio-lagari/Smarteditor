<!--
CARA PAKAI:
1. Unggah file smart_text_editor_blogspot.html ke hosting statis yang mendukung HTML
   (misalnya GitHub Pages atau hosting web Anda).
2. Ganti URL-APLIKASI-ANDA di bawah dengan URL file tersebut.
3. Di Blogger, buka Halaman/Postingan > Edit > tampilan HTML, lalu tempel kode ini.
Catatan: Blogger tidak menjalankan backend FastAPI. Versi ini berjalan di browser dan
fitur dasarnya tidak membutuhkan API key. Untuk keamanan dan kestabilan, sematkan dari
hosting statis; editor Blogger dapat menghapus atau membatasi tag script.
-->
<div style="width:100%;max-width:1200px;margin:0 auto;">
  <iframe
    src="URL-APLIKASI-ANDA"
    title="Smart Text Editor &amp; Proofreader"
    style="display:block;width:100%;height:1500px;border:0;border-radius:12px;"
    loading="lazy"
    allow="clipboard-write">
  </iframe>
</div>
